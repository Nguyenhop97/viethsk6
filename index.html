    '<div class="w rev">'+esc(main)+'</div>'+
    (sub?'<div class="m rev">'+esc(sub)+'</div>':'')+
    '<div class="ex rev">'+esc(ex)+'</div></article>';
}
function render(){
  if(S.tab==='review'){ renderReview(); return; }
  var k=S.tab, d=DECKS[k], c=countKnown(k);
  var chips='<button class="chip" aria-pressed="'+(S.group===-1)+'" data-g="-1">Tất cả</button>'+
    d.groups.map(function(g,i){return '<button class="chip" aria-pressed="'+(S.group===i)+'" data-g="'+i+'">'+esc(g.name)+'</button>';}).join('');
  var q=S.q.trim().toLowerCase();
  var list=allItems(k).filter(function(x){
    if(S.group!==-1 && x.gi!==S.group) return false;
    if(S.onlyTodo && known[x.id]) return false;
    if(q && x.it.join(' ').toLowerCase().indexOf(q)===-1) return false;
    return true;
  });
  var html='<div class="bar">'+
    '<input class="search" id="q" type="search" placeholder="Tìm theo chữ Hán hoặc tiếng Việt" value="'+esc(S.q)+'" aria-label="Tìm kiếm">'+
    '<label class="tog" for="hide"><input type="checkbox" id="hide"'+(S.hide?' checked':'')+'>Che đáp án để tự kiểm tra</label>'+
    '<label class="tog" for="todo"><input type="checkbox" id="todo"'+(S.onlyTodo?' checked':'')+'>Chỉ hiện chưa thuộc</label></div>'+
    '<div class="chips">'+chips+'</div>'+
    '<div class="prog">Đã thuộc <b>'+c.n+'</b> / '+c.t+' '+d.unit+'<div class="bartrack"><i style="width:'+(c.t?Math.round(c.n/c.t*100):0)+'%"></i></div></div>'+
    (S.hide?'<div class="prog">Chạm vào thẻ để hiện đáp án.</div>':'');
  if(!list.length){ html+='<div class="empty">Không có mục nào khớp.</div>'; }
  else{
    // group headings when showing all groups
    html+='<div class="'+(S.hide?'hide ':'')+'grid" id="grid">'+list.map(function(x){return cardHtml(x,k);}).join('')+'</div>';
  }
  html+='<section class="notes">'+d.notes+'</section>';
  app.innerHTML=html;
  var qi=document.getElementById('q'); if(S.q){ qi.focus(); qi.setSelectionRange(S.q.length,S.q.length); }
}
function buildFc(){
  var d=S.fcDeck; S.fcList=allItems(d).filter(function(x){return !known[x.id];});
  if(!S.fcList.length) S.fcList=allItems(d);
  S.fcIdx=0; S.fcFlip=false;
}
function renderReview(){
  if(!S.fcList.length) buildFc();
  var decks=['vocab','grammar','frames'].map(function(k){
    return '<button class="chip" aria-pressed="'+(S.fcDeck===k)+'" data-deck="'+k+'">'+DECKS[k].title+'</button>';
  }).join('');
  var x=S.fcList[S.fcIdx], it=x.it, isV=S.fcDeck==='vocab', d=DECKS[S.fcDeck];
  var front=esc(it[0]);
  var back='<div class="lab">Đáp án</div><div class="big">'+esc(it[1])+'</div>'+(isV?'<div class="m">'+esc(it[2])+'</div>':'')+'<div class="ex">'+esc(isV?it[3]:it[2])+'</div>';
  var face=S.fcFlip?back:'<div class="lab">'+d.keyLabel+'</div><div class="front">'+front+'</div><div class="hint">Chạm vào thẻ để lật</div>';
  app.innerHTML='<div class="fc"><div class="decks">'+decks+'</div>'+
    '<div class="count">Thẻ '+(S.fcIdx+1)+' / '+S.fcList.length+' (chưa thuộc trước)</div>'+
    '<div class="fcard'+(isV&&!S.fcFlip?' vocabfront':'')+'" id="fcard" tabindex="0" role="button" aria-label="Lật thẻ">'+face+'</div>'+
    '<div class="fcrow"><button class="btn" data-fc="prev">Trước</button>'+
    '<button class="btn" data-fc="again">Chưa thuộc</button>'+
    '<button class="btn pri" data-fc="got">Đã thuộc</button>'+
    '<button class="btn" data-fc="next">Sau</button>'+
    '<button class="btn" data-fc="shuffle">Xáo trộn</button></div>'+
    '<div class="prog" style="text-align:center;margin-top:14px">Phím tắt: Space lật thẻ, mũi tên trái phải chuyển thẻ</div></div>';
}
function fcMove(n){ var L=S.fcList.length; S.fcIdx=(S.fcIdx+n+L)%L; S.fcFlip=false; renderReview(); }

/* ---------- EVENTS ---------- */
tabs.addEventListener('click',function(e){ var b=e.target.closest('[data-tab]'); if(b) setTab(b.dataset.tab); });
app.addEventListener('click',function(e){
  var t=e.target;
  var chk=t.closest('[data-chk]');
  if(chk){ var id=chk.dataset.chk; if(known[id]) delete known[id]; else known[id]=1; save(); render(); e.stopPropagation(); return; }
  var g=t.closest('[data-g]'); if(g){ S.group=+g.dataset.g; render(); return; }
  var dk=t.closest('[data-deck]'); if(dk){ S.fcDeck=dk.dataset.deck; buildFc(); renderReview(); return; }
  var fc=t.closest('[data-fc]');
  if(fc){
    var a=fc.dataset.fc, cur=S.fcList[S.fcIdx];
    if(a==='prev') fcMove(-1);
    else if(a==='next') fcMove(1);
    else if(a==='got'){ known[cur.id]=1; save(); fcMove(1); }
    else if(a==='again'){ delete known[cur.id]; save(); fcMove(1); }
    else if(a==='shuffle'){ S.fcList.sort(function(){return Math.random()-0.5;}); S.fcIdx=0; S.fcFlip=false; renderReview(); }
    return;
  }
  if(t.closest('#fcard')){ S.fcFlip=!S.fcFlip; renderReview(); return; }
  var card=t.closest('.card'); if(card && S.hide){ card.classList.toggle('shown'); }
});
app.addEventListener('input',function(e){
  if(e.target.id==='q'){ S.q=e.target.value; render(); }
});
app.addEventListener('change',function(e){
  if(e.target.id==='hide'){ S.hide=e.target.checked; render(); }
  if(e.target.id==='todo'){ S.onlyTodo=e.target.checked; render(); }
});
document.addEventListener('keydown',function(e){
  if(S.tab!=='review') return;
  if(e.target && e.target.tagName==='INPUT') return;
  if(e.key===' '){ e.preventDefault(); S.fcFlip=!S.fcFlip; renderReview(); }
  else if(e.key==='ArrowRight') fcMove(1);
  else if(e.key==='ArrowLeft') fcMove(-1);
});
function fromHash(){
  var h=(location.hash||'').replace('#',''), found=null;
  ORDER.forEach(function(k){ if(slugFor(k)===h) found=k; });
  return found;
}
window.addEventListener('hashchange',function(){ var k=fromHash(); if(k && k!==S.tab) setTab(k,false); });
S.tab=fromHash()||'vocab'; renderTabs(); render();
</script>
</body>
